name: Library link research (one-off)
on:
  push:
    branches: [library-links]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node research/ia-lookup.mjs
      - run: |
          git config user.name "Risbek"; git config user.email "RisbekH@users.noreply.github.com"
          git add research/ia-results.json; git commit -m "Library link research results [skip ci]"; git push || true
