name: Photo research (one-off)
on:
  push:
    branches: [photo-research]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node research/find-photos.mjs
      - run: |
          git config user.name "Risbek"; git config user.email "RichardHewitt@LostTribesCafe.com"
          git add research/photos.json; git commit -m "Photo research results [skip ci]"; git push || true
