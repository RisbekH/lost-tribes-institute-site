<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">One representing the many</title>
  <desc id="d">Three emblems, twelve points for the nation, seven pillars for wisdom and a flame for the presence of God, send streams of light that meet in a single shining point.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A34"/>
      <stop offset="1" stop-color="#0B1318"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F6D49A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F6D49A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="905" y2="0">
      <stop offset="0" stop-color="#E59A6B"/>
      <stop offset="1" stop-color="#F6D49A"/>
    </linearGradient>
  </defs>
  <style>
    .lbl{font:600 17px Georgia,'Times New Roman',serif;letter-spacing:.22em;fill:#A9B6BC;text-anchor:middle}
    .one{fill:#F6D49A;font-size:19px}
    .base{fill:none;stroke:#E59A6B;stroke-opacity:.22;stroke-width:1.5}
    .flow{fill:none;stroke:url(#thread);stroke-width:6;stroke-linecap:round;stroke-dasharray:.1 52;animation:flow 2.6s linear infinite}
    .f2{animation-delay:-.9s}.f3{animation-delay:-1.7s}
    .tw{fill:#E59A6B;animation:tw 3.6s ease-in-out infinite}
    .star{fill:#A9B6BC;animation:tw 5s ease-in-out infinite}
    .ring{fill:none;stroke:#F6D49A;stroke-width:1.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ring 4.2s ease-out infinite}
    .r2{animation-delay:-1.4s}.r3{animation-delay:-2.8s}
    .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4.2s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite}
    .flame.in{animation-duration:1.1s}
    .pil{stroke:#E59A6B;stroke-width:5;stroke-linecap:round;animation:tw 4.9s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-52.1}}
    @keyframes tw{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(7);opacity:0}}
    @keyframes breathe{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.12);opacity:1}}
    @keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.07) skewX(-3deg)}65%{transform:scale(1.03,.95) skewX(3deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint field of "the many" -->
  <g>
    <circle class="star" cx="420" cy="70" r="1.6"/><circle class="star" cx="560" cy="112" r="1.2" style="animation-delay:-1s"/>
    <circle class="star" cx="700" cy="60" r="1.5" style="animation-delay:-2s"/><circle class="star" cx="840" cy="130" r="1.2" style="animation-delay:-3s"/>
    <circle class="star" cx="1080" cy="90" r="1.6" style="animation-delay:-1.5s"/><circle class="star" cx="1120" cy="250" r="1.2" style="animation-delay:-2.5s"/>
    <circle class="star" cx="1090" cy="470" r="1.5" style="animation-delay:-.5s"/><circle class="star" cx="820" cy="520" r="1.2" style="animation-delay:-3.5s"/>
    <circle class="star" cx="640" cy="570" r="1.6" style="animation-delay:-4s"/><circle class="star" cx="470" cy="548" r="1.2" style="animation-delay:-2.2s"/>
    <circle class="star" cx="60" cy="60" r="1.4" style="animation-delay:-1.2s"/><circle class="star" cx="52" cy="560" r="1.4" style="animation-delay:-3.1s"/>
  </g>

  <!-- threads -->
  <path class="base" d="M262 130 C560 130 620 315 905 315"/>
  <path class="base" d="M262 315 H905"/>
  <path class="base" d="M262 500 C560 500 620 315 905 315"/>
  <path class="flow" d="M262 130 C560 130 620 315 905 315"/>
  <path class="flow f2" d="M262 315 H905"/>
  <path class="flow f3" d="M262 500 C560 500 620 315 905 315"/>

  <!-- the nation: twelve -->
  <g>
    <circle class="tw" cx="125" cy="100" r="6"/><circle class="tw" cx="155" cy="100" r="6" style="animation-delay:-.3s"/><circle class="tw" cx="185" cy="100" r="6" style="animation-delay:-.6s"/><circle class="tw" cx="215" cy="100" r="6" style="animation-delay:-.9s"/>
    <circle class="tw" cx="125" cy="130" r="6" style="animation-delay:-1.2s"/><circle class="tw" cx="155" cy="130" r="6" style="animation-delay:-1.5s"/><circle class="tw" cx="185" cy="130" r="6" style="animation-delay:-1.8s"/><circle class="tw" cx="215" cy="130" r="6" style="animation-delay:-2.1s"/>
    <circle class="tw" cx="125" cy="160" r="6" style="animation-delay:-2.4s"/><circle class="tw" cx="155" cy="160" r="6" style="animation-delay:-2.7s"/><circle class="tw" cx="185" cy="160" r="6" style="animation-delay:-3s"/><circle class="tw" cx="215" cy="160" r="6" style="animation-delay:-3.3s"/>
    <text class="lbl" x="170" y="205">THE NATION</text>
  </g>

  <!-- wisdom: seven pillars -->
  <g>
    <path d="M118 282 L170 262 L222 282" fill="none" stroke="#E59A6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="pil" x1="125" y1="296" x2="125" y2="346"/><line class="pil" x1="140" y1="296" x2="140" y2="346" style="animation-delay:-.7s"/>
    <line class="pil" x1="155" y1="296" x2="155" y2="346" style="animation-delay:-1.4s"/><line class="pil" x1="170" y1="296" x2="170" y2="346" style="animation-delay:-2.1s"/>
    <line class="pil" x1="185" y1="296" x2="185" y2="346" style="animation-delay:-2.8s"/><line class="pil" x1="200" y1="296" x2="200" y2="346" style="animation-delay:-3.5s"/>
    <line class="pil" x1="215" y1="296" x2="215" y2="346" style="animation-delay:-4.2s"/>
    <line x1="114" y1="356" x2="226" y2="356" stroke="#E59A6B" stroke-width="4" stroke-linecap="round"/>
    <text class="lbl" x="170" y="392">WISDOM</text>
  </g>

  <!-- the presence: flame -->
  <g>
    <path class="flame" fill="#E59A6B" d="M170 452 C176 478 204 492 204 516 A34 34 0 0 1 136 516 C136 500 148 492 152 478 C158 486 164 480 170 452Z"/>
    <path class="flame in" fill="#F6D49A" d="M171 492 C174 506 188 512 188 526 A17 17 0 0 1 154 526 C154 516 162 512 164 504 C167 508 169 504 171 492Z"/>
    <text class="lbl" x="170" y="588">THE PRESENCE</text>
  </g>

  <!-- the one -->
  <g>
    <circle class="halo" cx="930" cy="315" r="120" fill="url(#glow)"/>
    <circle class="ring" cx="930" cy="315" r="20"/>
    <circle class="ring r2" cx="930" cy="315" r="20"/>
    <circle class="ring r3" cx="930" cy="315" r="20"/>
    <circle cx="930" cy="315" r="19" fill="#F6D49A"/>
    <circle cx="930" cy="315" r="9" fill="#FFF6E0"/>
    <text class="lbl one" x="930" y="492">THE ONE</text>
  </g>
</svg>
